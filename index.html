<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#02040d">

<title>Dino Invaders: Space</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
  background:#02040d;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>

// ========================================
// DINO INVADERS: SPACE V2.4
// iPHONE CONTROL + IMAGE LOAD FIX
// ========================================

const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d",{
  alpha:false,
  desynchronized:true
});

let W = 0;
let H = 0;


// ========================================
// BLOCK SAFARI SCROLL / PULL DOWN
// ========================================

document.addEventListener("touchmove", e=>{
  e.preventDefault();
},{passive:false});

document.addEventListener("gesturestart", e=>{
  e.preventDefault();
},{passive:false});

document.addEventListener("gesturechange", e=>{
  e.preventDefault();
},{passive:false});


// ========================================
// PLAYER IMAGE
// ========================================

const raptorImg = new Image();

let raptorReady = false;
let raptorFailed = false;

raptorImg.onload = ()=>{
  raptorReady = true;
  raptorFailed = false;
};

raptorImg.onerror = ()=>{
  raptorReady = false;
  raptorFailed = true;
};

raptorImg.src =
"8BBBE99D-BE50-463D-AB99-9356374B034D.png";


// ========================================
// STATE
// ========================================

let state = "start";

let score = 0;

let high =
Number(localStorage.spaceHigh || 0);

let gameTime = 0;
let difficulty = 1;
let screenShake = 0;


// ========================================
// PLAYER
// ========================================

const player = {
  x:100,
  y:300,
  radius:18,
  width:145,
  fireCooldown:0
};


// ========================================
// FIRE BUTTON
// ========================================

const fireButton = {
  x:0,
  y:0,
  radius:50
};


// ========================================
// OBJECTS
// ========================================

let stars = [];
let bullets = [];
let meteors = [];
let particles = [];


// ========================================
// TOUCH STATE
// ========================================

let moveTouchID = null;
let fireTouchID = null;

let lastMoveX = 0;
let lastMoveY = 0;

let firing = false;


// ========================================
// RESIZE
// ========================================

function resize(){

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W;
  canvas.height = H;

  ctx.imageSmoothingEnabled = true;

  fireButton.x = W - 72;

  // HIGHER FIRE BUTTON
  fireButton.y = H - 165;

  createStars();

  player.x =
  Math.max(55,Math.min(W-65,player.x));

  player.y =
  Math.max(55,Math.min(H-65,player.y));
}

window.addEventListener("resize",resize);


// ========================================
// STARS
// ========================================

function createStars(){

  stars = [];

  const count =
  Math.min(
    110,
    Math.floor(W*H/4200)
  );

  for(let i=0;i<count;i++){

    stars.push({
      x:Math.random()*W,
      y:Math.random()*H,
      size:.5+Math.random()*1.8,
      speed:.3+Math.random()*1.8,
      alpha:.3+Math.random()*.7
    });
  }
}


// ========================================
// RESET
// ========================================

function reset(){

  score = 0;
  gameTime = 0;
  difficulty = 1;
  screenShake = 0;

  bullets = [];
  meteors = [];
  particles = [];

  player.x =
  Math.min(100,W*.25);

  player.y = H*.5;

  player.fireCooldown = 0;

  moveTouchID = null;
  fireTouchID = null;

  firing = false;
}


// ========================================
// START
// ========================================

function startGame(){

  // NEVER START AS A RED DOT

  if(!raptorReady){
    return;
  }

  reset();

  state = "play";
}


// ========================================
// FIRE BUTTON HITBOX
// ========================================

function onFireButton(x,y){

  const dx = x-fireButton.x;
  const dy = y-fireButton.y;

  // Slightly larger invisible hit area
  const r = fireButton.radius+14;

  return dx*dx+dy*dy <= r*r;
}


// ========================================
// SHOOT
// ========================================

function shoot(){

  if(state!=="play"){
    return;
  }

  bullets.push({
    x:player.x+55,
    y:player.y-5,
    vx:12,
    radius:4
  });

  player.fireCooldown = 7;

  for(let i=0;i<3;i++){

    particles.push({
      x:player.x+54,
      y:player.y-5,
      vx:2+Math.random()*3,
      vy:(Math.random()-.5)*2,
      life:10,
      size:2+Math.random()*2,
      type:"laser"
    });
  }
}


// ========================================
// METEORS
// ========================================

function spawnMeteor(){

  const radius =
  20+Math.random()*28;

  const speed =
  2.5+
  difficulty*.22+
  Math.random()*1.6;

  meteors.push({

    x:W+radius+40,

    y:
    Math.random()*
    (H+120)-60,

    vx:-speed,

    vy:
    (Math.random()-.5)*
    (1+difficulty*.12),

    radius,

    rotation:
    Math.random()*Math.PI*2,

    spin:
    (Math.random()-.5)*.065,

    health:
    radius>38 ? 2 : 1
  });
}


// ========================================
// PARTICLES
// ========================================

function burst(x,y,amount,type){

  for(let i=0;i<amount;i++){

    particles.push({
      x,
      y,
      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.5)*7,
      life:14+Math.random()*16,
      size:1+Math.random()*4,
      type
    });
  }
}


// ========================================
// COLLISION
// ========================================

function hitCircle(
  ax,ay,ar,
  bx,by,br
){

  const dx = ax-bx;
  const dy = ay-by;

  const r = ar+br;

  return dx*dx+dy*dy < r*r;
}


// ========================================
// DEATH
// ========================================

function die(){

  if(state!=="play"){
    return;
  }

  state = "dead";

  firing = false;

  moveTouchID = null;
  fireTouchID = null;

  screenShake = 12;

  burst(
    player.x,
    player.y,
    26,
    "red"
  );

  if(score>high){

    high = score;

    localStorage.spaceHigh = high;
  }
}


// ========================================
// UPDATE
// ========================================

function update(){

  // STARS

  for(const s of stars){

    s.x -=
    s.speed*
    (state==="play" ? 1.3 : .35);

    if(s.x<-5){

      s.x = W+5;
      s.y = Math.random()*H;
    }
  }


  // SHAKE

  if(screenShake>0){

    screenShake *= .78;

    if(screenShake<.2){
      screenShake = 0;
    }
  }


  // PARTICLES

  for(let i=particles.length-1;i>=0;i--){

    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.life--;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }


  if(state!=="play"){
    return;
  }


  gameTime++;

  difficulty =
  1+gameTime/1800;


  // PLAYER BOUNDS

  player.x =
  Math.max(
    50,
    Math.min(W-65,player.x)
  );

  player.y =
  Math.max(
    50,
    Math.min(H-65,player.y)
  );


  // WEAPON

  if(player.fireCooldown>0){
    player.fireCooldown--;
  }

  if(
    firing &&
    player.fireCooldown<=0
  ){
    shoot();
  }


  // METEOR SPAWN

  const spawnRate =
  Math.max(
    34,
    80-Math.floor(difficulty*6)
  );

  if(gameTime%spawnRate===0){
    spawnMeteor();
  }


  // BULLETS

  for(let i=bullets.length-1;i>=0;i--){

    const b = bullets[i];

    b.x += b.vx;

    if(b.x>W+40){
      bullets.splice(i,1);
    }
  }


  // METEORS

  for(let i=meteors.length-1;i>=0;i--){

    const m = meteors[i];

    m.x += m.vx;
    m.y += m.vy;

    m.rotation += m.spin;


    // RAPTOR COLLISION

    if(
      hitCircle(
        player.x,
        player.y,
        player.radius,

        m.x,
        m.y,
        m.radius*.72
      )
    ){

      die();
      break;
    }


    // BULLET COLLISION

    let destroyed = false;

    for(let j=bullets.length-1;j>=0;j--){

      const b = bullets[j];

      if(
        hitCircle(
          b.x,
          b.y,
          b.radius,

          m.x,
          m.y,
          m.radius*.8
        )
      ){

        bullets.splice(j,1);

        m.health--;

        burst(
          b.x,
          b.y,
          4,
          "rock"
        );

        if(m.health<=0){

          burst(
            m.x,
            m.y,
            15,
            "rock"
          );

          score +=
          Math.round(m.radius);

          meteors.splice(i,1);

          screenShake = 3;

          destroyed = true;

          break;
        }
      }
    }

    if(destroyed){
      continue;
    }


    if(
      m.x < -m.radius-60 ||
      m.y < -180 ||
      m.y > H+180
    ){
      meteors.splice(i,1);
    }
  }
}


// ========================================
// BACKGROUND
// ========================================

function drawSpace(){

  const g =
  ctx.createLinearGradient(
    0,0,W,H
  );

  g.addColorStop(0,"#020611");
  g.addColorStop(.5,"#07132d");
  g.addColorStop(1,"#160824");

  ctx.fillStyle = g;

  ctx.fillRect(0,0,W,H);


  // STARS

  for(const s of stars){

    ctx.globalAlpha = s.alpha;

    ctx.fillStyle = "#fff";

    ctx.fillRect(
      s.x,
      s.y,
      s.size,
      s.size
    );
  }

  ctx.globalAlpha = 1;
}


// ========================================
// METEOR DRAWING
// ========================================

function drawMeteor(m){

  ctx.save();

  ctx.translate(m.x,m.y);
  ctx.rotate(m.rotation);

  ctx.fillStyle = "#625d61";

  ctx.beginPath();

  const points = 9;

  for(let i=0;i<points;i++){

    const angle =
    i/points*Math.PI*2;

    const variation =
    1+
    Math.sin(
      i*7.3+m.radius
    )*.13;

    const r =
    m.radius*variation;

    const x =
    Math.cos(angle)*r;

    const y =
    Math.sin(angle)*r;

    if(i===0){
      ctx.moveTo(x,y);
    }else{
      ctx.lineTo(x,y);
    }
  }

  ctx.closePath();
  ctx.fill();


  ctx.fillStyle = "#8b8180";

  ctx.beginPath();

  ctx.arc(
    -m.radius*.25,
    -m.radius*.28,
    m.radius*.25,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle = "#39363c";

  ctx.beginPath();

  ctx.arc(
    m.radius*.28,
    m.radius*.14,
    m.radius*.19,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


// ========================================
// BULLETS
// ========================================

function drawBullets(){

  for(const b of bullets){

    ctx.fillStyle = "#ff3030";

    ctx.fillRect(
      b.x-11,
      b.y-2,
      25,
      4
    );

    ctx.fillStyle = "#fff";

    ctx.fillRect(
      b.x+5,
      b.y-1,
      9,
      2
    );
  }
}


// ========================================
// PARTICLES
// ========================================

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha =
    Math.max(0,p.life/28);

    if(p.type==="red"){

      ctx.fillStyle="#ff302d";

    }else if(p.type==="laser"){

      ctx.fillStyle="#ff4a43";

    }else{

      ctx.fillStyle="#b59a82";
    }

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha = 1;
}


// ========================================
// RAPTOR
// ========================================

function drawPlayer(){

  // Don't substitute a red dot anymore.

  if(!raptorReady){
    return;
  }

  const w = player.width;

  const h =
  w*
  raptorImg.naturalHeight/
  raptorImg.naturalWidth;

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.drawImage(
    raptorImg,

    -w*.46,
    -h*.5,

    w,
    h
  );

  ctx.restore();
}


// ========================================
// FIRE BUTTON
// ========================================

function drawFireButton(){

  if(state!=="play"){
    return;
  }

  ctx.save();


  // LARGE OUTER HIT INDICATOR

  ctx.globalAlpha =
  firing ? .85 : .5;

  ctx.fillStyle="#420a12";

  ctx.beginPath();

  ctx.arc(
    fireButton.x,
    fireButton.y,
    fireButton.radius,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.globalAlpha=1;

  ctx.strokeStyle="#ff3434";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.arc(
    fireButton.x,
    fireButton.y,
    fireButton.radius-3,
    0,
    Math.PI*2
  );

  ctx.stroke();


  ctx.globalAlpha =
  firing ? 1 : .72;

  ctx.fillStyle="#d31e29";

  ctx.beginPath();

  ctx.arc(
    fireButton.x,
    fireButton.y,
    34,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.globalAlpha=1;

  ctx.fillStyle="#fff";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.font="bold 14px Arial";

  ctx.fillText(
    "FIRE",
    fireButton.x,
    fireButton.y
  );

  ctx.restore();
}


// ========================================
// HUD
// ========================================

function drawHUD(){

  ctx.textAlign="center";
  ctx.textBaseline="alphabetic";

  ctx.fillStyle="#fff";

  ctx.font="bold 27px Arial";

  ctx.fillText(
    score,
    W/2,
    45
  );

  ctx.font="bold 13px Arial";

  ctx.fillText(
    "BEST "+high,
    W/2,
    66
  );
}


// ========================================
// START SCREEN
// ========================================

function drawStart(){

  ctx.fillStyle =
  "rgba(2,5,15,.78)";

  ctx.fillRect(
    22,
    H*.25,
    W-44,
    285
  );

  ctx.textAlign="center";

  ctx.fillStyle="#fff";

  ctx.font="bold 32px Arial";

  ctx.fillText(
    "DINO INVADERS",
    W/2,
    H*.34
  );

  ctx.fillStyle="#ff3535";

  ctx.font="bold 27px Arial";

  ctx.fillText(
    "SPACE",
    W/2,
    H*.395
  );


  if(raptorReady){

    ctx.fillStyle="#fff";

    ctx.font="16px Arial";

    ctx.fillText(
      "DRAG TO FLY",
      W/2,
      H*.48
    );

    ctx.fillText(
      "FIRE BUTTON TO SHOOT",
      W/2,
      H*.52
    );

    ctx.font="bold 20px Arial";

    ctx.fillText(
      "TAP TO LAUNCH",
      W/2,
      H*.61
    );

  }else if(raptorFailed){

    ctx.fillStyle="#ff5555";

    ctx.font="bold 17px Arial";

    ctx.fillText(
      "RAPTOR IMAGE FAILED TO LOAD",
      W/2,
      H*.50
    );

    ctx.fillStyle="#fff";

    ctx.font="14px Arial";

    ctx.fillText(
      "Refresh the game",
      W/2,
      H*.55
    );

  }else{

    ctx.fillStyle="#fff";

    ctx.font="bold 17px Arial";

    ctx.fillText(
      "LOADING RAPTOR...",
      W/2,
      H*.51
    );
  }
}


// ========================================
// GAME OVER
// ========================================

function drawDead(){

  ctx.fillStyle =
  "rgba(2,5,15,.82)";

  ctx.fillRect(
    25,
    H*.33,
    W-50,
    205
  );

  ctx.textAlign="center";

  ctx.fillStyle="#ff3535";

  ctx.font="bold 29px Arial";

  ctx.fillText(
    "RAPTOR DOWN",
    W/2,
    H*.41
  );

  ctx.fillStyle="#fff";

  ctx.font="20px Arial";

  ctx.fillText(
    "Score: "+score,
    W/2,
    H*.48
  );

  ctx.font="bold 19px Arial";

  ctx.fillText(
    "TAP TO RELAUNCH",
    W/2,
    H*.56
  );
}


// ========================================
// DRAW
// ========================================

function draw(){

  ctx.save();

  if(screenShake>0){

    ctx.translate(
      (Math.random()-.5)*screenShake,
      (Math.random()-.5)*screenShake
    );
  }

  drawSpace();

  for(const m of meteors){
    drawMeteor(m);
  }

  drawBullets();
  drawParticles();
  drawPlayer();

  ctx.restore();

  drawHUD();
  drawFireButton();

  if(state==="start"){
    drawStart();
  }

  if(state==="dead"){
    drawDead();
  }
}


// ========================================
// LOOP
// ========================================

let last = performance.now();
let accumulator = 0;

const STEP = 1000/60;

function loop(now){

  let delta = now-last;

  last = now;

  if(delta>80){
    delta=80;
  }

  accumulator += delta;

  while(accumulator>=STEP){

    update();

    accumulator -= STEP;
  }

  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


// ========================================
// TOUCH HELPERS
// ========================================

function touchPosition(touch){

  const rect =
  canvas.getBoundingClientRect();

  return{
    x:touch.clientX-rect.left,
    y:touch.clientY-rect.top
  };
}


// ========================================
// TOUCH START
// ========================================

canvas.addEventListener(
"touchstart",
function(e){

  e.preventDefault();

  // START / RESTART

  if(
    state==="start" ||
    state==="dead"
  ){

    startGame();
    return;
  }


  for(const touch of e.changedTouches){

    const p =
    touchPosition(touch);


    // FIRE GETS PRIORITY

    if(
      onFireButton(p.x,p.y) &&
      fireTouchID===null
    ){

      fireTouchID =
      touch.identifier;

      firing = true;

      if(player.fireCooldown<=0){
        shoot();
      }

      continue;
    }


    // MOVEMENT

    if(moveTouchID===null){

      moveTouchID =
      touch.identifier;

      lastMoveX = p.x;
      lastMoveY = p.y;
    }
  }

},
{passive:false}
);


// ========================================
// TOUCH MOVE
// ========================================

canvas.addEventListener(
"touchmove",
function(e){

  e.preventDefault();

  if(state!=="play"){
    return;
  }

  for(const touch of e.touches){

    if(
      touch.identifier !==
      moveTouchID
    ){
      continue;
    }

    const p =
    touchPosition(touch);

    const dx =
    p.x-lastMoveX;

    const dy =
    p.y-lastMoveY;


    player.x += dx;
    player.y += dy;


    player.x =
    Math.max(
      50,
      Math.min(
        W-65,
        player.x
      )
    );

    player.y =
    Math.max(
      50,
      Math.min(
        H-65,
        player.y
      )
    );


    lastMoveX = p.x;
    lastMoveY = p.y;
  }

},
{passive:false}
);


// ========================================
// TOUCH RELEASE
// ========================================

function releaseTouches(e){

  e.preventDefault();

  for(const touch of e.changedTouches){

    if(
      touch.identifier===
      moveTouchID
    ){
      moveTouchID=null;
    }

    if(
      touch.identifier===
      fireTouchID
    ){
      fireTouchID=null;
      firing=false;
    }
  }
}


canvas.addEventListener(
"touchend",
releaseTouches,
{passive:false}
);

canvas.addEventListener(
"touchcancel",
releaseTouches,
{passive:false}
);


// ========================================
// INITIALIZE
// ========================================

resize();

</script>
</body>
</html>
