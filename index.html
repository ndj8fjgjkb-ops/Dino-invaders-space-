<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#02040d">

<title>Dino Invaders: Space</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040d;
  touch-action:none;
  font-family:Arial,sans-serif;
  -webkit-user-select:none;
  user-select:none;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  touch-action:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

// =====================================
// DINO INVADERS: SPACE V2
// DRAG TO MOVE + FIRE BUTTON
// =====================================

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d",{
    alpha:false,
    desynchronized:true
  });

let W = innerWidth;
let H = innerHeight;


// =====================================
// CANVAS
// =====================================

function resize(){

  W = innerWidth;
  H = innerHeight;

  canvas.width =
    Math.round(W);

  canvas.height =
    Math.round(H);

  ctx.imageSmoothingEnabled = true;

  createStars();

  player.x =
    Math.min(
      Math.max(player.x,55),
      W-55
    );

  player.y =
    Math.min(
      Math.max(player.y,45),
      H-45
    );
}

addEventListener(
  "resize",
  resize
);


// =====================================
// RAPTOR IMAGE
// =====================================

const raptorImg =
  new Image();

raptorImg.src =
"8BBBE99D-BE50-463D-AB99-9356374B034D.png";


// =====================================
// GAME STATE
// =====================================

let state = "start";

let score = 0;

let high =
  Number(
    localStorage.spaceHigh || 0
  );

let time = 0;

let difficulty = 1;

let screenShake = 0;


// =====================================
// PLAYER
// =====================================

const player = {

  x:90,
  y:300,

  radius:18,

  width:145,

  fireCooldown:0
};


// =====================================
// OBJECT ARRAYS
// =====================================

let stars = [];
let bullets = [];
let meteors = [];
let particles = [];


// =====================================
// CONTROLS
// =====================================

let movePointer = null;

let firePointer = null;

let firing = false;

let lastMoveX = 0;
let lastMoveY = 0;


// FIRE BUTTON

const fireButton = {

  x:0,
  y:0,

  radius:47
};


function updateFireButton(){

  fireButton.x =
    W - 68;

  fireButton.y =
    H - 88;
}


// =====================================
// STARS
// =====================================

function createStars(){

  stars = [];

  const count =
    Math.min(
      110,
      Math.floor(
        W * H / 4200
      )
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    stars.push({

      x:
        Math.random()*W,

      y:
        Math.random()*H,

      size:
        .5 +
        Math.random()*1.8,

      speed:
        .25 +
        Math.random()*1.8,

      alpha:
        .3 +
        Math.random()*.7
    });
  }
}


// =====================================
// RESET
// =====================================

function reset(){

  score = 0;

  time = 0;

  difficulty = 1;

  screenShake = 0;

  bullets.length = 0;

  meteors.length = 0;

  particles.length = 0;

  player.x =
    Math.min(
      95,
      W*.25
    );

  player.y =
    H*.5;

  player.fireCooldown = 0;

  movePointer = null;

  firePointer = null;

  firing = false;
}


// =====================================
// START GAME
// =====================================

function startGame(){

  reset();

  state = "play";
}


// =====================================
// FIRE BUTTON HIT TEST
// =====================================

function insideFireButton(x,y){

  const dx =
    x-fireButton.x;

  const dy =
    y-fireButton.y;

  return(
    dx*dx +
    dy*dy <=
    fireButton.radius*
    fireButton.radius
  );
}


// =====================================
// SHOOT
// =====================================

function shoot(){

  if(state !== "play"){
    return;
  }

  bullets.push({

    x:
      player.x + 55,

    y:
      player.y - 5,

    vx:12,

    radius:4
  });

  player.fireCooldown = 7;


  // MUZZLE FLASH

  for(
    let i=0;
    i<3;
    i++
  ){

    particles.push({

      x:
        player.x + 53,

      y:
        player.y - 5,

      vx:
        2 +
        Math.random()*3,

      vy:
        (Math.random()-.5)*2,

      life:
        8 +
        Math.random()*4,

      size:
        2 +
        Math.random()*2,

      type:"laser"
    });
  }
}


// =====================================
// SPAWN METEOR
// =====================================

function spawnMeteor(){

  const radius =
    20 +
    Math.random()*28;

  const startY =
    Math.random()*
    (H+160)-80;

  const speed =
    2.5 +
    difficulty*.22 +
    Math.random()*1.6;

  const vy =
    (Math.random()-.5)*
    (
      1 +
      difficulty*.12
    );

  meteors.push({

    x:
      W +
      radius +
      40,

    y:startY,

    vx:-speed,

    vy:vy,

    radius:radius,

    rotation:
      Math.random()*
      Math.PI*2,

    spin:
      (Math.random()-.5)*
      .065,

    health:
      radius>38 ? 2 : 1
  });
}


// =====================================
// PARTICLE BURST
// =====================================

function burst(
  x,
  y,
  amount,
  type
){

  for(
    let i=0;
    i<amount;
    i++
  ){

    particles.push({

      x:x,
      y:y,

      vx:
        (Math.random()-.5)*7,

      vy:
        (Math.random()-.5)*7,

      life:
        14 +
        Math.random()*16,

      size:
        1 +
        Math.random()*4,

      type:type
    });
  }
}


// =====================================
// COLLISION
// =====================================

function hitCircle(
  ax,
  ay,
  ar,
  bx,
  by,
  br
){

  const dx =
    ax-bx;

  const dy =
    ay-by;

  const r =
    ar+br;

  return(
    dx*dx +
    dy*dy <
    r*r
  );
}


// =====================================
// DEATH
// =====================================

function die(){

  if(state !== "play"){
    return;
  }

  state = "dead";

  firing = false;

  movePointer = null;

  firePointer = null;

  screenShake = 12;

  burst(
    player.x,
    player.y,
    26,
    "red"
  );

  if(score > high){

    high = score;

    localStorage.spaceHigh =
      high;
  }
}


// =====================================
// UPDATE STARS
// =====================================

function updateStars(){

  for(const s of stars){

    s.x -=
      s.speed *
      (
        state==="play"
        ? 1.3
        : .35
      );

    if(s.x < -5){

      s.x = W+5;

      s.y =
        Math.random()*H;
    }
  }
}


// =====================================
// UPDATE
// =====================================

function update(){

  updateStars();


  // SHAKE

  if(screenShake > 0){

    screenShake *= .78;

    if(screenShake < .2){

      screenShake = 0;
    }
  }


  // PARTICLES

  for(
    let i =
      particles.length-1;
    i>=0;
    i--
  ){

    const p =
      particles[i];

    p.x += p.vx;

    p.y += p.vy;

    p.life--;

    if(p.life <= 0){

      particles.splice(
        i,
        1
      );
    }
  }


  if(state !== "play"){
    return;
  }


  time++;

  difficulty =
    1 +
    time/1800;


  // KEEP PLAYER ON SCREEN

  player.x =
    Math.max(
      48,
      Math.min(
        W-60,
        player.x
      )
    );

  player.y =
    Math.max(
      42,
      Math.min(
        H-48,
        player.y
      )
    );


  // FIRING

  if(player.fireCooldown > 0){

    player.fireCooldown--;
  }

  if(
    firing &&
    player.fireCooldown <= 0
  ){

    shoot();
  }


  // METEOR SPAWNING

  const spawnRate =
    Math.max(
      34,
      80 -
      Math.floor(
        difficulty*6
      )
    );

  if(
    time % spawnRate === 0
  ){

    spawnMeteor();
  }


  // BULLETS

  for(
    let i =
      bullets.length-1;
    i>=0;
    i--
  ){

    const b =
      bullets[i];

    b.x += b.vx;

    if(b.x > W+40){

      bullets.splice(
        i,
        1
      );
    }
  }


  // METEORS

  for(
    let i =
      meteors.length-1;
    i>=0;
    i--
  ){

    const m =
      meteors[i];

    m.x += m.vx;

    m.y += m.vy;

    m.rotation +=
      m.spin;


    // PLAYER HIT

    if(
      hitCircle(

        player.x,
        player.y,
        player.radius,

        m.x,
        m.y,
        m.radius*.72
      )
    ){

      die();

      break;
    }


    // BULLET HIT

    let destroyed = false;

    for(
      let j =
        bullets.length-1;
      j>=0;
      j--
    ){

      const b =
        bullets[j];

      if(
        hitCircle(

          b.x,
          b.y,
          b.radius,

          m.x,
          m.y,
          m.radius*.8
        )
      ){

        bullets.splice(
          j,
          1
        );

        m.health--;

        burst(
          b.x,
          b.y,
          4,
          "rock"
        );

        if(m.health <= 0){

          burst(
            m.x,
            m.y,
            15,
            "rock"
          );

          score +=
            Math.round(
              m.radius
            );

          meteors.splice(
            i,
            1
          );

          screenShake = 3;

          destroyed = true;

          break;
        }
      }
    }

    if(destroyed){
      continue;
    }


    // REMOVE OFF SCREEN

    if(
      m.x < -m.radius-60 ||
      m.y < -180 ||
      m.y > H+180
    ){

      meteors.splice(
        i,
        1
      );
    }
  }
}


// =====================================
// BACKGROUND
// =====================================

function drawSpace(){

  const g =
    ctx.createLinearGradient(
      0,
      0,
      W,
      H
    );

  g.addColorStop(
    0,
    "#020611"
  );

  g.addColorStop(
    .5,
    "#07132d"
  );

  g.addColorStop(
    1,
    "#160824"
  );

  ctx.fillStyle = g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  // BLUE/PURPLE NEBULA

  const nebula =
    ctx.createRadialGradient(

      W*.7,
      H*.3,
      5,

      W*.7,
      H*.3,
      W*.7
    );

  nebula.addColorStop(
    0,
    "rgba(76,70,180,.20)"
  );

  nebula.addColorStop(
    .45,
    "rgba(20,80,145,.09)"
  );

  nebula.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle =
    nebula;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  // STARS

  for(const s of stars){

    ctx.globalAlpha =
      s.alpha;

    ctx.fillStyle =
      "#ffffff";

    ctx.fillRect(
      Math.round(s.x),
      Math.round(s.y),
      s.size,
      s.size
    );
  }

  ctx.globalAlpha = 1;
}


// =====================================
// METEOR DRAWING
// =====================================

function drawMeteor(m){

  ctx.save();

  ctx.translate(
    m.x,
    m.y
  );

  ctx.rotate(
    m.rotation
  );

  ctx.fillStyle =
    "#625d61";

  ctx.beginPath();

  const points = 9;

  for(
    let i=0;
    i<points;
    i++
  ){

    const angle =
      i/points *
      Math.PI*2;

    const variation =
      1 +
      Math.sin(
        i*7.3 +
        m.radius
      )*.13;

    const r =
      m.radius *
      variation;

    const x =
      Math.cos(angle)*r;

    const y =
      Math.sin(angle)*r;

    if(i===0){

      ctx.moveTo(x,y);

    }else{

      ctx.lineTo(x,y);
    }
  }

  ctx.closePath();

  ctx.fill();


  // HIGHLIGHT

  ctx.fillStyle =
    "#8b8180";

  ctx.beginPath();

  ctx.arc(
    -m.radius*.25,
    -m.radius*.28,
    m.radius*.25,
    0,
    Math.PI*2
  );

  ctx.fill();


  // CRATER

  ctx.fillStyle =
    "#39363c";

  ctx.beginPath();

  ctx.arc(
    m.radius*.28,
    m.radius*.14,
    m.radius*.19,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


// =====================================
// BULLETS
// =====================================

function drawBullets(){

  for(const b of bullets){

    ctx.fillStyle =
      "#ff2f2f";

    ctx.fillRect(
      b.x-11,
      b.y-2,
      24,
      4
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.fillRect(
      b.x+6,
      b.y-1,
      8,
      2
    );
  }
}


// =====================================
// PARTICLES
// =====================================

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha =
      Math.max(
        0,
        p.life/28
      );

    if(
      p.type === "red"
    ){

      ctx.fillStyle =
        "#ff302d";

    }else if(
      p.type === "laser"
    ){

      ctx.fillStyle =
        "#ff4a43";

    }else{

      ctx.fillStyle =
        "#b59a82";
    }

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha = 1;
}


// =====================================
// PLAYER
// =====================================

function drawPlayer(){

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  if(
    raptorImg.complete &&
    raptorImg.naturalWidth
  ){

    const w =
      player.width;

    const h =
      w *
      raptorImg.naturalHeight /
      raptorImg.naturalWidth;

    ctx.drawImage(
      raptorImg,
      -w*.46,
      -h*.5,
      w,
      h
    );

  }else{

    ctx.fillStyle =
      "#d82c2c";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      18,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}


// =====================================
// FIRE BUTTON
// =====================================

function drawFireButton(){

  if(state !== "play"){
    return;
  }

  ctx.save();


  // OUTER RING

  ctx.globalAlpha =
    firing ? .72 : .42;

  ctx.fillStyle =
    "#3d0b12";

  ctx.beginPath();

  ctx.arc(
    fireButton.x,
    fireButton.y,
    fireButton.radius,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.globalAlpha =
    firing ? 1 : .8;

  ctx.strokeStyle =
    "#ff3b3b";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.arc(
    fireButton.x,
    fireButton.y,
    fireButton.radius-3,
    0,
    Math.PI*2
  );

  ctx.stroke();


  // INNER BUTTON

  ctx.globalAlpha =
    firing ? .9 : .58;

  ctx.fillStyle =
    "#d51e29";

  ctx.beginPath();

  ctx.arc(
    fireButton.x,
    fireButton.y,
    33,
    0,
    Math.PI*2
  );

  ctx.fill();


  // FIRE TEXT

  ctx.globalAlpha = 1;

  ctx.fillStyle =
    "#ffffff";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.font =
    "bold 14px Arial";

  ctx.fillText(
    "FIRE",
    fireButton.x,
    fireButton.y+1
  );

  ctx.restore();
}


// =====================================
// HUD
// =====================================

function drawHUD(){

  ctx.textBaseline =
    "alphabetic";

  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "bold 27px Arial";

  ctx.fillText(
    score,
    W/2,
    45
  );

  ctx.font =
    "bold 13px Arial";

  ctx.fillText(
    "BEST " + high,
    W/2,
    66
  );
}


// =====================================
// START SCREEN
// =====================================

function drawStart(){

  ctx.fillStyle =
    "rgba(2,5,15,.75)";

  ctx.fillRect(
    22,
    H*.25,
    W-44,
    285
  );

  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "bold 32px Arial";

  ctx.fillText(
    "DINO INVADERS",
    W/2,
    H*.34
  );

  ctx.fillStyle =
    "#ff3535";

  ctx.font =
    "bold 27px Arial";

  ctx.fillText(
    "SPACE",
    W/2,
    H*.395
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "16px Arial";

  ctx.fillText(
    "DRAG TO FLY",
    W/2,
    H*.48
  );

  ctx.fillText(
    "USE FIRE BUTTON TO SHOOT",
    W/2,
    H*.52
  );

  ctx.font =
    "bold 20px Arial";

  ctx.fillText(
    "TAP TO LAUNCH",
    W/2,
    H*.61
  );
}


// =====================================
// GAME OVER
// =====================================

function drawDead(){

  ctx.fillStyle =
    "rgba(2,5,15,.80)";

  ctx.fillRect(
    25,
    H*.33,
    W-50,
    205
  );

  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#ff3535";

  ctx.font =
    "bold 29px Arial";

  ctx.fillText(
    "RAPTOR DOWN",
    W/2,
    H*.41
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "20px Arial";

  ctx.fillText(
    "Score: " + score,
    W/2,
    H*.48
  );

  ctx.font =
    "bold 19px Arial";

  ctx.fillText(
    "TAP TO RELAUNCH",
    W/2,
    H*.56
  );
}


// =====================================
// DRAW
// =====================================

function draw(){

  ctx.save();

  if(screenShake > 0){

    ctx.translate(
      (Math.random()-.5)*
      screenShake,

      (Math.random()-.5)*
      screenShake
    );
  }

  drawSpace();

  for(const m of meteors){

    drawMeteor(m);
  }

  drawBullets();

  drawParticles();

  drawPlayer();

  ctx.restore();


  drawHUD();

  drawFireButton();


  if(state === "start"){

    drawStart();
  }

  if(state === "dead"){

    drawDead();
  }
}


// =====================================
// GAME LOOP
// =====================================

let last =
  performance.now();

let accumulator = 0;

const STEP =
  1000/60;


function loop(now){

  let delta =
    now-last;

  last = now;

  if(delta > 80){

    delta = 80;
  }

  accumulator +=
    delta;

  while(
    accumulator >= STEP
  ){

    update();

    accumulator -=
      STEP;
  }

  draw();

  requestAnimationFrame(
    loop
  );
}

requestAnimationFrame(
  loop
);


// =====================================
// POINTER POSITION
// =====================================

function pointerPosition(e){

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:
      e.clientX -
      rect.left,

    y:
      e.clientY -
      rect.top
  };
}


// =====================================
// POINTER DOWN
// =====================================

canvas.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    const p =
      pointerPosition(e);


    // START / RESTART

    if(
      state === "start" ||
      state === "dead"
    ){

      startGame();

      return;
    }


    // FIRE BUTTON

    if(
      insideFireButton(
        p.x,
        p.y
      )
    ){

      firePointer =
        e.pointerId;

      firing = true;

      if(
        player.fireCooldown <= 0
      ){

        shoot();
      }

      try{

        canvas.setPointerCapture(
          e.pointerId
        );

      }catch(err){}

      return;
    }


    // MOVEMENT POINTER

    if(movePointer === null){

      movePointer =
        e.pointerId;

      lastMoveX =
        p.x;

      lastMoveY =
        p.y;

      try{

        canvas.setPointerCapture(
          e.pointerId
        );

      }catch(err){}
    }

  },
  {passive:false}
);


// =====================================
// POINTER MOVE
// =====================================

canvas.addEventListener(
  "pointermove",
  e=>{

    if(
      state !== "play"
    ){
      return;
    }

    if(
      e.pointerId !==
      movePointer
    ){
      return;
    }

    e.preventDefault();

    const p =
      pointerPosition(e);


    /*
      RELATIVE DRAG:

      The raptor moves by the same
      amount the player's finger moves.

      It does NOT snap underneath
      the finger.
    */

    const dx =
      p.x-lastMoveX;

    const dy =
      p.y-lastMoveY;


    player.x += dx;

    player.y += dy;


    player.x =
      Math.max(
        48,
        Math.min(
          W-60,
          player.x
        )
      );


    player.y =
      Math.max(
        42,
        Math.min(
          H-48,
          player.y
        )
      );


    lastMoveX =
      p.x;

    lastMoveY =
      p.y;

  },
  {passive:false}
);


// =====================================
// POINTER RELEASE
// =====================================

function releasePointer(e){

  if(
    e.pointerId ===
    firePointer
  ){

    firePointer = null;

    firing = false;
  }


  if(
    e.pointerId ===
    movePointer
  ){

    movePointer = null;
  }
}


canvas.addEventListener(
  "pointerup",
  releasePointer
);

canvas.addEventListener(
  "pointercancel",
  releasePointer
);


// =====================================
// INITIALIZE
// =====================================

resize();

updateFireButton();

addEventListener(
  "resize",
  updateFireButton
);

</script>

</body>
</html>
