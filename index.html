function button(x,y,w,h,label,c1="#0e5f86",c2="#152d69",stroke="#71edff"){const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,w,h,12);ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.shadowColor=stroke;ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.font=gameFont(16);ctx.textAlign="center";ctx.fillText(label,x+w/2,y+h*.64)}
function drawHUD(){
 ctx.textBaseline="alphabetic";ctx.textAlign="left";ctx.fillStyle="rgba(2,10,24,.78)";ctx.fillRect(8,8,Math.min(212,W-76),56);
 ctx.fillStyle="#fff";ctx.font=gameFont(22);ctx.shadowColor="#49dfff";ctx.shadowBlur=7;ctx.fillText("SCORE "+score,16,31);ctx.shadowBlur=0;
 ctx.fillStyle="#bfeeff";ctx.font="700 10px system-ui,sans-serif";ctx.fillText("SECTOR "+sector+"/5   LV "+level+"   KILLS "+invaderKills,16,50);
 const boss=enemies.find(e=>e.type==="boss"||e.type==="dreadnought");let hudY=94;
 if(boss){const bw=Math.min(250,W*.60),bx=(W-bw)/2,by=75;ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(bx-2,by-2,bw+4,12);ctx.fillStyle="#fff";ctx.fillRect(bx,by,bw,8);ctx.fillStyle=boss.type==="dreadnought"?"#9c78ff":"#ff405c";ctx.fillRect(bx,by,bw*(boss.health/boss.maxHealth),8);ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="bold 10px Arial";ctx.fillText(boss.type==="dreadnought"?"VOID SPINOSAUR":"WAR T-REX",W/2,by+23);hudY=116}
 ctx.textAlign="center";
 for(const [active,label,color] of [[meteorStormTimer>0,"METEOR STORM "+Math.ceil(meteorStormTimer/60)+"s","#ffb04f"],[overdriveTimer>0,"OVERDRIVE "+Math.ceil(overdriveTimer/60)+"s","#82aaff"],[spreadTimer>0,"TRI BURST "+Math.ceil(spreadTimer/60)+"s","#67f7ff"],[shieldHits>0,"SHIELD "+shieldHits,"#7dff9d"],[combo>=2,"COMBO "+combo+" x"+comboMult().toFixed(2),"#ffd45b"]]){if(active){ctx.fillStyle=color;ctx.font="bold 11px Arial";ctx.fillText(label,W/2,hudY);hudY+=16}}
 if(combo>=5){const tier=comboTier();ctx.textAlign="center";ctx.fillStyle=combo>=20?"#ff7657":"#ffd45b";ctx.font="900 12px system-ui,sans-serif";ctx.fillText(tier,W/2,hudY+2)}
 for(const p of scorePops){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.textAlign="center";ctx.fillStyle="#ffe07a";ctx.font="900 12px system-ui,sans-serif";ctx.fillText(p.text,p.x,p.y)}ctx.globalAlpha=1;
 if(state==="play")button(W-54,18,42,34,"II","#17304f","#09192e","#8cecff");

 if(powerMessage>0){ctx.textAlign="center";ctx.globalAlpha=Math.min(1,powerMessage/20);ctx.font="bold 18px Arial";const msgY=Math.max(170,H*.30),tw=Math.min(W-40,ctx.measureText(powerMessageText).width+28);ctx.fillStyle="rgba(3,10,25,.78)";ctx.fillRect((W-tw)/2,msgY-25,tw,36);ctx.fillStyle="#fff";ctx.fillText(powerMessageText,W/2,msgY);ctx.globalAlpha=1}
}
function drawPause(){panel(W*.12,H*.32,W*.76,H*.28,"#071326","#171635","#6deaff");ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font=gameFont(28);ctx.fillText("PAUSED",W/2,H*.405);ctx.fillStyle="#8cecff";ctx.font="700 13px system-ui,sans-serif";ctx.fillText("TAP RESUME TO CONTINUE",W/2,H*.455);button(W*.25,H*.50,W*.50,48,"RESUME","#075f83","#153665","#6deaff")}
function startLayout(){const top=Math.max(34,H*.065),statsY=top+112,heroTop=statsY+82,heroH=Math.max(112,Math.min(205,H*.48-heroTop)),launchY=Math.min(H-158,heroTop+heroH+18);return{top,statsY,heroTop,heroH,launchY}}
function drawStart(){
 const m=18,{top,statsY,heroTop,heroH,launchY}=startLayout();
 ctx.save();
 // Cinematic full-screen space backdrop.
 if(milkyReady){ctx.globalAlpha=.58;ctx.filter="brightness(.55) saturate(1.22) contrast(1.15)";const ir=milkyImg.naturalWidth/milkyImg.naturalHeight,sr=W/H;let sx=0,sy=0,sw=milkyImg.naturalWidth,sh=milkyImg.naturalHeight;if(ir>sr){sw=sh*sr;sx=(milkyImg.naturalWidth-sw)*.5}else{sh=sw/sr;sy=(milkyImg.naturalHeight-sh)*.5}ctx.drawImage(milkyImg,sx,sy,sw,sh,0,0,W,H);ctx.filter="none";ctx.globalAlpha=1}
 const vign=ctx.createRadialGradient(W*.5,H*.42,20,W*.5,H*.42,Math.max(W,H)*.72);vign.addColorStop(0,"rgba(4,18,42,.08)");vign.addColorStop(.72,"rgba(1,5,17,.40)");vign.addColorStop(1,"rgba(0,2,9,.82)");ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
 // Futuristic console grid.
 ctx.globalAlpha=.10;ctx.strokeStyle="#5de8ff";ctx.lineWidth=1;for(let y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=0;x<W;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.globalAlpha=1;
 // Ghosted invader silhouettes as background underlays.
 if(approvedFlyingEnemyImg.complete&&approvedFlyingEnemyImg.naturalWidth){ctx.save();ctx.globalAlpha=.075;ctx.filter="grayscale(1) brightness(1.8)";const uw=Math.min(190,W*.48),uh=uw*approvedFlyingEnemyImg.naturalHeight/approvedFlyingEnemyImg.naturalWidth;ctx.drawImage(approvedFlyingEnemyImg,-uw*.22,H*.22,uw,uh);ctx.scale(-1,1);ctx.drawImage(approvedFlyingEnemyImg,-W-uw*.18,H*.52,uw,uh);ctx.restore()}
 // Redesigned logo: score-attack identity only.
 ctx.textAlign="center";ctx.fillStyle="#ff9b3d";ctx.font=gameFont(Math.min(48,W*.122));ctx.shadowColor="#ff4d20";ctx.shadowBlur=18;ctx.fillText("DINO",W/2,top+38);ctx.fillStyle="#f4fbff";ctx.shadowColor="#48dfff";ctx.shadowBlur=15;ctx.fillText("INVADERS",W/2,top+79);ctx.shadowBlur=0;
 ctx.fillStyle="#80eaff";ctx.font="800 12px system-ui,sans-serif";ctx.letterSpacing="2px";ctx.fillText("ENDLESS SCORE ATTACK",W/2,top+103);ctx.letterSpacing="0px";
 // Records console.
 const pw=W-2*m;ctx.fillStyle="rgba(3,13,31,.78)";ctx.beginPath();ctx.roundRect(m,statsY,pw,64,12);ctx.fill();ctx.strokeStyle="rgba(88,226,255,.55)";ctx.lineWidth=1.4;ctx.stroke();
 const brm=Math.floor(bestRunTime/60),brs=Math.floor(bestRunTime%60),survivalRecord=brm+":"+String(brs).padStart(2,"0");const stats=[["HIGH SCORE",high],["LONGEST SURVIVAL",survivalRecord],["INVADERS DESTROYED",totalKills]];for(let i=0;i<3;i++){const x=m+pw*(i+.5)/3;ctx.fillStyle="#83a9c2";ctx.font="800 9px system-ui,sans-serif";ctx.fillText(stats[i][0],x,statsY+21);ctx.fillStyle="#fff";ctx.font=gameFont(21);ctx.fillText(stats[i][1],x,statsY+48)}
 // Central objective console: no character, no core-defense language, no top-right copy.
 const card=ctx.createLinearGradient(m,heroTop,W-m,heroTop+heroH);card.addColorStop(0,"rgba(4,18,39,.91)");card.addColorStop(.5,"rgba(8,35,58,.82)");card.addColorStop(1,"rgba(20,17,49,.90)");ctx.fillStyle=card;ctx.beginPath();ctx.roundRect(m,heroTop,pw,heroH,16);ctx.fill();ctx.strokeStyle="rgba(89,225,255,.62)";ctx.lineWidth=1.5;ctx.shadowColor="#35d8ff";ctx.shadowBlur=9;ctx.stroke();ctx.shadowBlur=0;
 ctx.fillStyle="#ffad4d";ctx.font=gameFont(20);ctx.fillText("SURVIVE. SCORE. REPEAT.",W/2,heroTop+35);
 ctx.fillStyle="#d8f6ff";ctx.font="800 13px system-ui,sans-serif";ctx.fillText("LAST AS LONG AS YOU CAN",W/2,heroTop+64);
 ctx.fillStyle="#91b8ce";ctx.font="700 11px system-ui,sans-serif";ctx.fillText("DESTROY INVADERS • DODGE METEORS",W/2,heroTop+88);
 ctx.fillText("BUILD COMBOS • CHASE THE HIGH SCORE",W/2,heroTop+108);
 const pulse=.55+.25*Math.sin(gameTime*.06);ctx.globalAlpha=pulse;ctx.strokeStyle="#ff7b38";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m+24,heroTop+heroH-22);ctx.lineTo(W*.32,heroTop+heroH-22);ctx.moveTo(W*.68,heroTop+heroH-22);ctx.lineTo(W-m-24,heroTop+heroH-22);ctx.stroke();ctx.globalAlpha=1;
 button(m+9,launchY,pw-18,60,"START RUN","#16994a","#07562c","#97ffc0");
 ctx.fillStyle="#d3e8f4";ctx.font="800 13px system-ui,sans-serif";ctx.fillText("HOLD TO FIRE  •  DRAG TO MOVE",W/2,launchY+88);
 ctx.fillStyle="#91aabd";ctx.font="bold 11px system-ui,sans-serif";ctx.fillText("VERSION 12.58",W/2,H-53);ctx.fillStyle="#fff";ctx.font="bold 13px system-ui,sans-serif";ctx.fillText("Built by Curtis Company Limited",W/2,H-35);
 ctx.restore();
}
function drawVictory(){drawDead()}
function drawDead(){
 panel(25,H*.27,W-50,310,"#160b22","#07172d","#ff4e76");ctx.textAlign="center";ctx.fillStyle="#ff5275";ctx.font=gameFont(31);ctx.shadowColor="#ff3d69";ctx.shadowBlur=12;ctx.fillText("RAPTOR DOWN",W/2,H*.35);ctx.shadowBlur=0;
 const runSecs=Math.floor(gameTime/60),runMin=Math.floor(runSecs/60),runRem=String(runSecs%60).padStart(2,"0");ctx.fillStyle="#fff";ctx.font="20px Arial";ctx.fillText("SCORE "+score,W/2,H*.405);ctx.font="15px Arial";ctx.fillText("SURVIVED "+runMin+":"+runRem+"   •   DISTANCE "+Math.floor(distance),W/2,H*.45);ctx.fillText("LEVEL "+level+"   •   INVADERS "+invaderKills+"   •   BOSSES "+bossesDefeated,W/2,H*.49);ctx.fillStyle="#66eaff";ctx.font="bold 13px Arial";ctx.fillText("BEST COMBO "+maxCombo+"x  •  ALL-TIME "+bestComboEver+"x",W/2,H*.515);
 ctx.fillStyle="#8cecff";ctx.font="bold 15px Arial";ctx.fillText("BEST LEVEL "+bestLevel+"   •   RUNS "+runs,W/2,H*.565);if(score>=high&&score>0){ctx.fillStyle="#ffd45b";ctx.font="900 13px system-ui,sans-serif";ctx.fillText("NEW HIGH SCORE",W/2,H*.59)}
 button(28,H*.615,W*.48-34,48,"RELAUNCH","#a82c4b","#4b1737","#ff6688");button(W*.52+6,H*.615,W*.48-34,48,"MAIN MENU","#075f83","#153665","#6deaff");
}
function draw(){
 ctx.save();if(screenShake>0)ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);
 drawSpace();for(const a of asteroids)drawAsteroid(a);for(const e of enemies)drawEnemy(e);drawPowerups();drawBullets();drawShockwaves();drawParticles();drawPlayer();ctx.restore();
 if(state==="play"||state==="paused")drawHUD();if(state==="start")drawStart();if(state==="paused")drawPause();if(state==="victory")drawVictory();if(state==="dead")drawDead();
}
let last=performance.now(),accumulator=0;const STEP=1000/60;
function loop(now){let delta=now-last;last=now;if(delta>66)delta=66;accumulator+=delta;let steps=0;while(accumulator>=STEP&&steps<3){update();accumulator-=STEP;steps++}if(steps===3&&accumulator>=STEP)accumulator=0;draw();requestAnimationFrame(loop)}
window.addEventListener("error",e=>{try{ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#030713";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.fillStyle="#ff6688";ctx.font=gameFont(24);ctx.fillText("SYSTEM RECOVERY",W/2,H*.42);ctx.fillStyle="#fff";ctx.font="14px system-ui,sans-serif";ctx.fillText("Reload Dino Invaders to relaunch Tex.",W/2,H*.48)}catch(_){}});
requestAnimationFrame(loop);
function touchPosition(touch){const rect=canvas.getBoundingClientRect();return{x:touch.clientX-rect.left,y:touch.clientY-rect.top}}
canvas.addEventListener("touchstart",function(e){
 e.preventDefault();initAudio();if(state==="start"&&audioReady){if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();startMenuMusic()}if(state==="victory"){for(const touch of e.changedTouches){const p=touchPosition(touch);if(p.y>=H*.59&&p.y<=H*.59+50){state="play";nextBossLevel=Math.max(nextBossLevel,15);return}if(p.y>=H*.67&&p.y<=H*.67+46){state="start";return}}return}if(state==="paused"){for(const touch of e.changedTouches){const p=touchPosition(touch);if(p.y>=H*.48&&p.y<=H*.57){resumeGrace=60;state="play";return}}return}if(state==="play"){for(const touch of e.changedTouches){const p=touchPosition(touch);if(p.x>=W-62&&p.y>=12&&p.y<=62){state="paused";firing=false;moveTouchID=null;return}}}if(state==="start"){for(const touch of e.changedTouches){const p=touchPosition(touch),{launchY}=startLayout();if(p.y>=launchY&&p.y<=launchY+58){startGame();return}}return}if(state==="dead"){for(const touch of e.changedTouches){const p=touchPosition(touch);if(p.y>=H*.615&&p.y<=H*.615+48){if(p.x<W*.5)startGame();else{state="start";firing=false;moveTouchID=null}return}}return}
 for(const touch of e.changedTouches){const p=touchPosition(touch);
  if(moveTouchID===null){
   moveTouchID=touch.identifier;lastMoveX=p.x;lastMoveY=p.y;firing=true;if(player.fireCooldown<=0)shoot();
  }
 }
},{passive:false});
canvas.addEventListener("touchmove",function(e){
 e.preventDefault();if(state!=="play")return;
 for(const touch of e.touches){if(touch.identifier!==moveTouchID)continue;const p=touchPosition(touch),dx=p.x-lastMoveX,dy=p.y-lastMoveY;
  const thrust=1;player.x+=dx*thrust;player.y+=dy*thrust;player.x=Math.max(50,Math.min(W-65,player.x));player.y=Math.max(50,Math.min(H-65,player.y));lastMoveX=p.x;lastMoveY=p.y;
 }
},{passive:false});
function releaseTouches(e){e.preventDefault();for(const touch of e.changedTouches){if(touch.identifier===moveTouchID){moveTouchID=null;firing=false}}}
canvas.addEventListener("touchend",releaseTouches,{passive:false});
canvas.addEventListener("touchcancel",releaseTouches,{passive:false});
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(state==="play")state="paused";moveTouchID=null;firing=false;accumulator=0;last=performance.now();if(audioCtx)audioCtx.suspend()}else{accumulator=0;last=performance.now()}});
window.addEventListener("pageshow",()=>{accumulator=0;last=performance.now()});
resize();
</script>
