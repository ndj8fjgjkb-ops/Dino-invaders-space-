<script>
// DINO INVADERS: SPACE V6.0 — RELEASE CANDIDATE
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d",{alpha:false,desynchronized:true});
let W=0,H=0;

document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});

const raptorImg=new Image();
let raptorReady=false,raptorFailed=false;
raptorImg.onload=()=>{raptorReady=true;raptorFailed=false};
raptorImg.onerror=()=>{raptorReady=false;raptorFailed=true};
raptorImg.src="8BBBE99D-BE50-463D-AB99-9356374B034D.png?v=60";

let state="start",score=0,combatScore=0,distance=0,high=Number(localStorage.spaceHigh||0),credits=Number(localStorage.dinoCredits||0),bestLevel=Number(localStorage.dinoBestLevel||1),runs=Number(localStorage.dinoRuns||0),permShield=Number(localStorage.permShield||0),permRapid=Number(localStorage.permRapid||0),permPower=Number(localStorage.permPower||0),lastCredits=0,gameTime=0,difficulty=1,screenShake=0;
const player={x:100,y:300,radius:6.8544,width:55.216,fireCooldown:0};
let stars=[],bullets=[],enemyBullets=[],asteroids=[],particles=[],shockwaves=[],enemies=[],planets=[],powerups=[];
let spreadTimer=0,shieldHits=0,powerMessage=0,powerMessageText="",level=1,lastLevel=1,wave=0,bossSpawned=false,runXP=0,upgradeTier=0,rapidLevel=0,powerLevel=0,spreadLevel=0,pierceLevel=0,upgradeChoices=[],bossCount=0,bossesDefeated=0;
let moveTouchID=null,lastMoveX=0,lastMoveY=0,firing=false;

function resize(){
 W=innerWidth;H=innerHeight;canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=true;
 createStars();createPlanets();
 player.x=Math.max(55,Math.min(W-65,player.x));player.y=Math.max(55,Math.min(H-65,player.y));
}
addEventListener("resize",resize);

function createStars(){
 stars=[];const count=Math.min(80,Math.floor(W*H/5200));
 for(let i=0;i<count;i++)stars.push({x:Math.random()*W,y:Math.random()*H,size:.5+Math.random()*1.8,speed:.3+Math.random()*1.8,alpha:.3+Math.random()*.7});
}


function createPlanets(){
 planets=[
  {x:W*.82,y:H*.22,r:Math.max(20.3,Math.min(W,H)*.05712),speed:.08,type:0},
  {x:W*1.55,y:H*.72,r:Math.max(14,Math.min(W,H)*.03808),speed:.055,type:1}
 ];
}
function updatePlanets(){
 for(const p of planets){
  p.x-=p.speed*(state==="play"?1.95:.525);
  if(p.x<-p.r*2){
   p.x=W+p.r*2+Math.random()*W*.8;
   p.y=p.r+Math.random()*Math.max(40,H-p.r*2);
   p.type=(p.type+1)%3;
  }
 }
}
function drawPlanets(){
 for(const p of planets){
  ctx.save();ctx.globalAlpha=.62;
  const g=ctx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.35,p.r*.08,p.x,p.y,p.r);
  if(p.type===0){g.addColorStop(0,"#8bd8ff");g.addColorStop(.5,"#2e6ba8");g.addColorStop(1,"#102342")}
  else if(p.type===1){g.addColorStop(0,"#ffc77a");g.addColorStop(.55,"#a64f35");g.addColorStop(1,"#401d31")}
  else{g.addColorStop(0,"#c7b6ff");g.addColorStop(.5,"#694c9b");g.addColorStop(1,"#231b48")}
  ctx.fillStyle=g;ctx.shadowColor=p.type===0?"#4ca8ff":"#a66cff";ctx.shadowBlur=22;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.globalAlpha=.18;ctx.fillStyle="#fff";
  ctx.beginPath();ctx.ellipse(p.x-p.r*.18,p.y-p.r*.15,p.r*.42,p.r*.09,-.2,0,Math.PI*2);ctx.fill();
  if(p.type===1){ctx.globalAlpha=.35;ctx.strokeStyle="#d7b28c";ctx.lineWidth=Math.max(3,p.r*.08);ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.35,p.r*.32,-.18,0,Math.PI*2);ctx.stroke()}
  ctx.restore();
 }
}
function spawnPowerup(type="spread"){
 if(powerups.length>=3)return;powerups.push({x:W+45,y:65+Math.random()*Math.max(80,H-130),vx:-1.75,radius:16,phase:Math.random()*Math.PI*2,type});
}
function drawPowerups(){
 for(const p of powerups){
  ctx.save();ctx.translate(p.x,p.y);const pulse=1+Math.sin(gameTime*.12+p.phase)*.12;ctx.scale(pulse,pulse);
  const shield=p.type==="shield";
  ctx.shadowColor=shield?"#68ff8c":"#49f6ff";ctx.shadowBlur=14;ctx.fillStyle=shield?"rgba(20,125,63,.95)":"rgba(18,104,135,.95)";ctx.strokeStyle=shield?"#b9ffc9":"#b8fbff";ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,p.radius,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.shadowBlur=12;ctx.fillStyle="#fff";ctx.font="bold 16px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(shield?"S":"3",0,.5);ctx.restore();
 }
}
function spawnEnemy(type="scout",offset=0){
 if(enemies.length>=10)return;
 const y=70+Math.random()*Math.max(100,H-140),hunter=type==="hunter",boss=type==="boss"||type==="dreadnought",dread=type==="dreadnought",gunner=type==="gunner";
 enemies.push({x:W+70+offset,y,baseY:y,vx:boss?-1.25:-(gunner?1.7:hunter?2.7:2.1)-Math.random()*.8-difficulty*.12,phase:Math.random()*Math.PI*2,health:dread?55:boss?30:gunner?5:hunter?4:2,maxHealth:dread?55:boss?30:gunner?5:hunter?4:2,radius:dread?40:boss?32:gunner?16:hunter?15:11.424,points:dread?5000:boss?2500:gunner?500:hunter?350:180,type,shotTimer:70+Math.random()*80});
}
function spawnBoss(){
 if(bossSpawned)return;bossSpawned=true;bossCount++;enemies.length=0;enemyBullets.length=0;
 const dread=bossCount%2===0;powerMessageText=dread?"WARNING: DREADNOUGHT":"WARNING: MOTHERSHIP";powerMessage=180;screenShake=6;
 spawnEnemy(dread?"dreadnought":"boss");
}
function spawnWave(){
 if(enemies.length>4)return;
 wave++;const count=Math.min(6,3+Math.floor(level/2));
 powerMessageText="INVADER WAVE "+wave;powerMessage=100;
 for(let i=0;i<count;i++){let type=level>=6&&i===0?"gunner":level>=2&&(i===count-1||level>=4&&i%3===2)?"hunter":"scout";spawnEnemy(type,i*48)}
}
function destroyEnemy(index){
 const e=enemies[index];combatScore+=e.points;runXP+=(e.type==="boss"||e.type==="dreadnought")?10:e.type==="gunner"?4:e.type==="hunter"?3:1;score=combatScore+Math.floor(distance);
 if(shockwaves.length<14)shockwaves.push({x:e.x,y:e.y,radius:8,maxRadius:55,life:15,maxLife:15});
 particles.push({x:e.x,y:e.y,vx:0,vy:0,life:8,maxLife:8,size:34,type:"flash"});
 burst(e.x,e.y,24,"hot",8);burst(e.x,e.y,18,"rock",7);
 enemies.splice(index,1);screenShake=Math.max(screenShake,5);
}
function drawEnemy(e){
 ctx.save();ctx.translate(e.x,e.y);const hunter=e.type==="hunter",dread=e.type==="dreadnought",boss=e.type==="boss"||dread,gunner=e.type==="gunner";
 if(boss){
  ctx.shadowColor=dread?"#8f65ff":"#ff3c54";ctx.shadowBlur=16;ctx.fillStyle=dread?"#24164d":"#541527";ctx.beginPath();ctx.ellipse(0,0,dread?46:38,dread?23:19,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dread?"#8f65ff":"#ff405c";ctx.beginPath();ctx.ellipse(0,dread?-10:-8,dread?28:22,dread?14:12,0,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ffc04d";for(let x=-24;x<=24;x+=12){ctx.beginPath();ctx.arc(x,8,2.5,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle="#fff";ctx.fillRect(dread?-36:-28,dread?30:24,dread?72:56,4);ctx.fillStyle=dread?"#9c78ff":"#ff405c";ctx.fillRect(dread?-36:-28,dread?30:24,(dread?72:56)*(e.health/e.maxHealth),4);ctx.shadowBlur=0;ctx.restore();return;
 }
 if(gunner){ctx.shadowColor="#ffd34d";ctx.shadowBlur=10;ctx.fillStyle="#493d12";ctx.beginPath();ctx.ellipse(0,0,18,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffd34d";ctx.fillRect(-7,-12,14,7);ctx.fillStyle="#ff6b3d";ctx.fillRect(-20,-2,8,4);ctx.shadowBlur=0;ctx.restore();return}
 ctx.shadowColor=hunter?"#ff4bdb":"#55e8ff";ctx.shadowBlur=10;
 ctx.fillStyle=hunter?"#42164d":"#162c49";ctx.beginPath();ctx.ellipse(0,0,hunter?17:13.328,hunter?8:6.664,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=hunter?"#ff66e6":"#59dfff";ctx.beginPath();ctx.ellipse(.952,hunter?-5:-3.808,hunter?8:6.188,hunter?5:4.284,0,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle=hunter?"#ff9a42":"#9d4dff";ctx.fillRect(hunter?-14:-10.472,hunter?5:3.808,hunter?6:4.76,1.904);ctx.fillRect(hunter?8:5.712,hunter?5:3.808,hunter?6:4.76,1.904);
 ctx.fillStyle="#ff426f";ctx.beginPath();ctx.arc(hunter?-11:-8.568,0,1.428,0,Math.PI*2);ctx.arc(hunter?11:8.568,0,1.428,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;ctx.restore();
}

function reset(){
 score=0;combatScore=0;distance=0;gameTime=0;difficulty=1;screenShake=0;bullets=[];enemyBullets=[];asteroids=[];particles=[];shockwaves=[];enemies=[];powerups=[];spreadTimer=0;shieldHits=0;powerMessage=0;powerMessageText="";level=1;lastLevel=1;wave=0;bossSpawned=false;bossCount=0;bossesDefeated=0;runXP=0;upgradeTier=0;rapidLevel=permRapid;powerLevel=permPower;spreadLevel=0;pierceLevel=0;upgradeChoices=[];shieldHits=permShield;
 player.x=Math.min(100,W*.25);player.y=H*.5;player.fireCooldown=0;moveTouchID=null;firing=false;
}
function startGame(){if(!raptorReady)return;reset();state="play"}
function shoot(){
 if(state!=="play"||bullets.length>=60)return;
 if(spreadTimer>0){
  bullets.push({x:player.x+31,y:player.y-3,vx:12,vy:0,radius:1.904,pierce:pierceLevel});
  bullets.push({x:player.x+31,y:player.y-3,vx:11.7,vy:-2.35,radius:1.904,pierce:pierceLevel});
  bullets.push({x:player.x+31,y:player.y-3,vx:11.7,vy:2.35,radius:1.904,pierce:pierceLevel});
 }else bullets.push({x:player.x+31,y:player.y-3,vx:12,vy:0,radius:1.904,pierce:pierceLevel});
 if(rapidLevel>=3&&powerLevel>=2&&bullets.length<55){bullets.push({x:player.x+31,y:player.y-8,vx:12.5,vy:-.55,radius:2.3,pierce:Math.max(1,pierceLevel)});bullets.push({x:player.x+31,y:player.y+3,vx:12.5,vy:.55,radius:2.3,pierce:Math.max(1,pierceLevel)})}
 player.fireCooldown=Math.max(3,7-rapidLevel);
 for(let i=0;i<3;i++)particles.push({x:player.x+30,y:player.y-3,vx:2+Math.random()*3,vy:(Math.random()-.5)*2,life:10,maxLife:10,size:2+Math.random()*2,type:"laser"});
}
function makeAsteroid(x,y,size,vx,vy){
 let radius,health,points;
 if(size===3){radius=22.848+Math.random()*4.76;health=3;points=100}
 else if(size===2){radius=14.756+Math.random()*3.332;health=2;points=60}
 else{radius=8.092+Math.random()*2.38;health=1;points=30}
 const shape=[],count=9+Math.floor(Math.random()*3);
 for(let i=0;i<count;i++)shape.push(.78+Math.random()*.35);
 return{x,y,size,radius,health,points,vx,vy,rotation:Math.random()*Math.PI*2,spin:(Math.random()-.5)*.045,shape,craterSeed:Math.random()*1000};
}
function spawnAsteroid(){
 const roll=Math.random();let size=roll<.18?3:roll<.52?2:1;
 const speed=2.3+difficulty*.2+Math.random()*1.4;
 asteroids.push(makeAsteroid(W+90,40+Math.random()*Math.max(100,H-80),size,-speed,(Math.random()-.5)*(1+difficulty*.1)));
}
function splitAsteroid(a){
 if(a.size<=1||asteroids.length>=24)return;
 const childSize=a.size-1;
 for(let i=0;i<2;i++){
  const direction=i===0?-1:1,speed=Math.abs(a.vx)*(1.05+Math.random()*.25);
  asteroids.push(makeAsteroid(a.x,a.y+direction*8,childSize,-speed,direction*(1.3+Math.random()*1.5)));
 }
}
function burst(x,y,amount,type,power=7){
 const room=Math.max(0,180-particles.length),count=Math.min(amount,room);
 for(let i=0;i<count;i++){const life=12+Math.random()*16;particles.push({x,y,vx:(Math.random()-.5)*power,vy:(Math.random()-.5)*power,life,maxLife:life,size:1+Math.random()*4,type})}
}
function hitCircle(ax,ay,ar,bx,by,br){const dx=ax-bx,dy=ay-by,r=ar+br;return dx*dx+dy*dy<r*r}
function die(){
 if(state!=="play")return;state="dead";firing=false;moveTouchID=null;screenShake=13;burst(player.x,player.y,32,"red",9);
 if(score>high){high=score;localStorage.spaceHigh=high}
 if(level>bestLevel){bestLevel=level;localStorage.dinoBestLevel=bestLevel}
 lastCredits=Math.max(1,Math.floor(score/1000)+Math.floor(distance/100)+bossesDefeated*5);credits+=lastCredits;runs++;localStorage.dinoCredits=credits;localStorage.dinoRuns=runs
}
function destroyAsteroid(index){
 const a=asteroids[index];combatScore+=a.points;runXP+=a.size===3?2:1;score=combatScore+Math.floor(distance);
 if(shockwaves.length<14)shockwaves.push({x:a.x,y:a.y,radius:a.radius*.2,maxRadius:a.radius*(a.size===3?1.8:1.5),life:a.size===3?18:14,maxLife:a.size===3?18:14});
 particles.push({x:a.x,y:a.y,vx:0,vy:0,life:8,maxLife:8,size:a.radius*.85,type:"flash"});
 burst(a.x,a.y,a.size===3?24:a.size===2?18:12,"rock",a.size===3?10:7);
 burst(a.x,a.y,a.size===3?14:a.size===2?10:7,"hot",7);
 const debrisCount=a.size===3?7:a.size===2?5:3;
 for(let i=0;i<debrisCount;i++){const life=24+Math.random()*22;particles.push({
  x:a.x+(Math.random()-.5)*a.radius*.4,y:a.y+(Math.random()-.5)*a.radius*.4,
  vx:(Math.random()-.5)*(a.size===3?12:9),vy:(Math.random()-.5)*(a.size===3?12:9),
  life,maxLife:life,size:3+Math.random()*(a.size===3?8:5),type:"debris",
  rotation:Math.random()*Math.PI*2,spin:(Math.random()-.5)*.35
 })}
 splitAsteroid(a);asteroids.splice(index,1);screenShake=Math.max(screenShake,a.size===3?9:a.size===2?6:3);
}
function update(){
 updatePlanets();
 for(const s of stars){s.x-=s.speed*(state==="play"?1.95:.525);if(s.x<-5){s.x=W+5;s.y=Math.random()*H}}
 if(screenShake>0){screenShake*=.78;if(screenShake<.2)screenShake=0}
 for(let i=shockwaves.length-1;i>=0;i--){const s=shockwaves[i];s.radius+=(s.maxRadius-s.radius)*.22;s.life--;if(s.life<=0)shockwaves.splice(i,1)}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;if(p.type==="debris")p.rotation+=p.spin;p.life--;if(p.life<=0||p.x<-100||p.x>W+100||p.y<-100||p.y>H+100)particles.splice(i,1)}
 if(state!=="play")return;
 gameTime++;distance+=1/12;score=combatScore+Math.floor(distance);level=1+Math.floor(gameTime/600);difficulty=1+gameTime/900+level*.16;
 if(level>lastLevel){lastLevel=level;powerMessageText="LEVEL "+level;powerMessage=110;screenShake=Math.max(screenShake,2)}
 if(spreadTimer>0)spreadTimer--;if(powerMessage>0)powerMessage--;
 const nextUpgrade=12+upgradeTier*5;
 if(runXP>=nextUpgrade&&state==="play"){runXP-=nextUpgrade;upgradeTier++;upgradeChoices=["RAPID FIRE","LASER POWER","PIERCING"];state="upgrade";firing=false;moveTouchID=null}
 if(gameTime===300||gameTime%780===0)spawnPowerup("spread");
 if(gameTime===540||gameTime%1200===0)spawnPowerup("shield");
 player.x=Math.max(50,Math.min(W-65,player.x));player.y=Math.max(50,Math.min(H-65,player.y));
 if(player.fireCooldown>0)player.fireCooldown--;if(firing&&player.fireCooldown<=0)shoot();
 const spawnRate=Math.max(20,58-Math.floor(difficulty*6));const preBoss=enemies.some(e=>e.type==="boss"||e.type==="dreadnought");if(gameTime%spawnRate===0&&asteroids.length<(preBoss?10:22))spawnAsteroid();
 const bossActive=enemies.some(e=>e.type==="boss"||e.type==="dreadnought");
 if(!bossActive&&gameTime>180 && gameTime%Math.max(150,300-Math.floor(difficulty*13))===0){const r=Math.random();spawnEnemy(level>=6&&r<.18?"gunner":level>=2&&r<Math.min(.62,.22+level*.035)?"hunter":"scout")}
 if(!bossActive&&(gameTime===360||gameTime%600===0))spawnWave();
 if(level>=5&&!bossSpawned)spawnBoss();
 if(level>=10&&bossSpawned&&!enemies.some(e=>e.type==="boss"||e.type==="dreadnought")&&gameTime%1200===0){bossSpawned=false;spawnBoss()}
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy||0;if(b.x>W+40||b.y<-40||b.y>H+40)bullets.splice(i,1)}
 for(let i=enemyBullets.length-1;i>=0;i--){const b=enemyBullets[i];b.x+=b.vx;b.y+=b.vy;if(hitCircle(player.x,player.y,player.radius+2,b.x,b.y,b.radius)){if(shieldHits>0){shieldHits--;burst(b.x,b.y,12,"hot",5);enemyBullets.splice(i,1);screenShake=4;continue}die();break}if(b.x<-30||b.y<-30||b.y>H+30)enemyBullets.splice(i,1)}
 for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];p.x+=p.vx;
  if(hitCircle(player.x,player.y,player.radius+5,p.x,p.y,p.radius)){
   if(p.type==="shield"){shieldHits=Math.min(2,shieldHits+1);powerMessageText="SHIELD READY!"}
   else{spreadTimer=600;powerMessageText="SPREAD SHOT!"}
   powerMessage=90;burst(p.x,p.y,20,"hot",6);powerups.splice(i,1);screenShake=Math.max(screenShake,3);continue}
  if(p.x<-40)powerups.splice(i,1);
 }
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];
  if(e.type==="boss"||e.type==="dreadnought"){if(e.x>W*.76)e.x+=e.vx;e.baseY=H*.5;e.y=e.baseY+Math.sin(gameTime*(e.type==="dreadnought"?.035:.025)+e.phase)*Math.min(e.type==="dreadnought"?145:110,H*.28);
   if(e.type==="dreadnought"&&e.x<W*.9){e.shotTimer--;if(e.shotTimer<=0&&enemyBullets.length<16){for(let a=-2;a<=2;a++){const ang=Math.PI+a*.18;enemyBullets.push({x:e.x-32,y:e.y,vx:Math.cos(ang)*4.4,vy:Math.sin(ang)*4.4,radius:4})}e.shotTimer=90}}
  }
  else{e.x+=e.vx;e.y=e.baseY+Math.sin(gameTime*(e.type==="hunter"?.065:.045)+e.phase)*(e.type==="hunter"?48:34)}
  if(e.type==="gunner"&&e.x<W*.92){e.shotTimer--;if(e.shotTimer<=0&&enemyBullets.length<16){const dx=player.x-e.x,dy=player.y-e.y,len=Math.hypot(dx,dy)||1,s=4.2+Math.min(2,difficulty*.12);enemyBullets.push({x:e.x-15,y:e.y,vx:dx/len*s,vy:dy/len*s,radius:4});e.shotTimer=Math.max(55,115-level*3)}}
  if(hitCircle(player.x,player.y,player.radius,e.x,e.y,e.radius)){
   if(shieldHits>0){shieldHits--;burst(player.x,player.y,24,"hot",7);if(shockwaves.length<14)shockwaves.push({x:player.x,y:player.y,radius:8,maxRadius:70,life:18,maxLife:18});enemies.splice(i,1);screenShake=7;continue}
   die();break}
  let enemyRemoved=false;
  for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];
   if(hitCircle(b.x,b.y,b.radius,e.x,e.y,e.radius)){
    if((b.pierce||0)>0)b.pierce--;else bullets.splice(j,1);e.health-=1+powerLevel;burst(b.x,b.y,7,"hot",4);
    if(e.health<=0){const wasBoss=e.type==="boss"||e.type==="dreadnought";const bossName=e.type==="dreadnought"?"DREADNOUGHT":"MOTHERSHIP";destroyEnemy(i);if(wasBoss){bossesDefeated++;powerMessageText=bossName+" DESTROYED!";powerMessage=180;spawnPowerup("shield")}enemyRemoved=true;break}
   }
  }
  if(enemyRemoved)continue;
  if(e.x<-80)enemies.splice(i,1);
 }
 for(let i=asteroids.length-1;i>=0;i--){
  const a=asteroids[i];a.x+=a.vx;a.y+=a.vy;a.rotation+=a.spin;
  if(hitCircle(player.x,player.y,player.radius,a.x,a.y,a.radius*.7)){
   if(shieldHits>0){shieldHits--;burst(player.x,player.y,24,"hot",7);if(shockwaves.length<14)shockwaves.push({x:player.x,y:player.y,radius:8,maxRadius:70,life:18,maxLife:18});destroyAsteroid(i);continue}
   die();break}
  let removed=false;
  for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];
   if(hitCircle(b.x,b.y,b.radius,a.x,a.y,a.radius*.82)){
    if((b.pierce||0)>0)b.pierce--;else bullets.splice(j,1);a.health-=1+powerLevel;burst(b.x,b.y,7,"hot",4);burst(b.x,b.y,5,"rock",4);
    if(a.health<=0){destroyAsteroid(i);removed=true;break}
   }
  }
  if(removed)continue;
  if(a.x<-a.radius-100||a.y<-180||a.y>H+180)asteroids.splice(i,1);
 }
}
function drawSpace(){
 const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#01040d");g.addColorStop(.48,"#07142e");g.addColorStop(1,"#170725");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const neb=ctx.createRadialGradient(W*.72,H*.28,10,W*.72,H*.28,W*.75);neb.addColorStop(0,"rgba(71,77,190,.17)");neb.addColorStop(.5,"rgba(36,64,140,.07)");neb.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=neb;ctx.fillRect(0,0,W,H);
 for(const s of stars){ctx.globalAlpha=s.alpha;ctx.fillStyle="#fff";ctx.fillRect(s.x,s.y,s.size,s.size)}ctx.globalAlpha=1;
}
function drawAsteroid(a){
 ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rotation);ctx.shadowColor="rgba(0,0,0,.7)";ctx.shadowBlur=8;
 const rock=ctx.createRadialGradient(-a.radius*.35,-a.radius*.4,2,0,0,a.radius*1.2);rock.addColorStop(0,"#aaa09a");rock.addColorStop(.28,"#766e69");rock.addColorStop(.65,"#4b4646");rock.addColorStop(1,"#242329");ctx.fillStyle=rock;
 ctx.beginPath();const count=a.shape.length;
 for(let i=0;i<count;i++){const angle=i/count*Math.PI*2,r=a.radius*a.shape[i],x=Math.cos(angle)*r,y=Math.sin(angle)*r;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
 ctx.closePath();ctx.fill();ctx.shadowBlur=0;
 ctx.fillStyle="rgba(25,23,27,.65)";ctx.beginPath();ctx.ellipse(-a.radius*.28,-a.radius*.17,a.radius*.23,a.radius*.16,.3,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="rgba(190,175,160,.22)";ctx.lineWidth=Math.max(1,a.radius*.04);ctx.beginPath();ctx.ellipse(-a.radius*.28,-a.radius*.17,a.radius*.23,a.radius*.16,.3,Math.PI,Math.PI*2);ctx.stroke();
 ctx.fillStyle="rgba(30,28,31,.55)";ctx.beginPath();ctx.arc(a.radius*.3,a.radius*.18,a.radius*.13,0,Math.PI*2);ctx.fill();
 if(a.size>1){ctx.fillStyle="rgba(38,34,35,.48)";ctx.beginPath();ctx.arc(a.radius*.12,-a.radius*.43,a.radius*.10,0,Math.PI*2);ctx.fill()}
 if(a.health<a.size){ctx.globalAlpha=.8;ctx.strokeStyle="#ff6b25";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-a.radius*.05,-a.radius*.55);ctx.lineTo(a.radius*.05,-a.radius*.18);ctx.lineTo(-a.radius*.15,a.radius*.1);ctx.lineTo(a.radius*.12,a.radius*.4);ctx.stroke();ctx.globalAlpha=1}
 ctx.restore();
}
function drawBullets(){
 for(const b of bullets){ctx.fillStyle="#ff3030";ctx.fillRect(b.x-5.236,b.y-.952,11.9,1.904);ctx.fillStyle="#fff";ctx.fillRect(b.x+2.38,b.y-.476,4.284,.952)}
 for(const b of enemyBullets){ctx.fillStyle="#ffd34d";ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ff633d";ctx.beginPath();ctx.arc(b.x,b.y,b.radius*.45,0,Math.PI*2);ctx.fill()}
}
function drawShockwaves(){
 for(const s of shockwaves){const alpha=Math.max(0,s.life/s.maxLife);ctx.save();ctx.globalAlpha=alpha*.8;ctx.strokeStyle="#ff9b3d";ctx.lineWidth=Math.max(2,5*alpha);ctx.beginPath();ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);ctx.stroke();ctx.restore()}
}
function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
  if(p.type==="flash"){
   const glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);glow.addColorStop(0,"rgba(255,255,255,1)");glow.addColorStop(.22,"rgba(255,226,125,.95)");glow.addColorStop(.55,"rgba(255,104,25,.55)");glow.addColorStop(1,"rgba(255,60,10,0)");
   ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();continue;
  }else if(p.type==="debris"){
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.fillStyle="#665b55";ctx.fillRect(-p.size*.65,-p.size*.4,p.size*1.3,p.size*.8);ctx.fillStyle="#a39183";ctx.fillRect(-p.size*.45,-p.size*.32,p.size*.5,p.size*.18);ctx.restore();continue;
  }else if(p.type==="red")ctx.fillStyle="#ff302d";
  else if(p.type==="laser")ctx.fillStyle="#ff4a43";
  else if(p.type==="hot")ctx.fillStyle=p.life%2===0?"#ff7a22":"#ffd36a";
  else ctx.fillStyle="#93847a";
  ctx.fillRect(p.x,p.y,p.size,p.size);
 }
 ctx.globalAlpha=1;
}
function drawPlayer(){
 if(!raptorReady)return;
 const w=player.width,h=w*raptorImg.naturalHeight/raptorImg.naturalWidth;
 const oldSmooth=ctx.imageSmoothingEnabled;ctx.imageSmoothingEnabled=true;
 ctx.save();
 ctx.translate(Math.round(player.x),Math.round(player.y));
 if(shieldHits>0){ctx.strokeStyle="rgba(100,255,150,.8)";ctx.shadowColor="#68ff8c";ctx.shadowBlur=18;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,24,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}
 ctx.drawImage(raptorImg,Math.round(-w*.46),Math.round(-h*.5),Math.round(w),Math.round(h));
 ctx.restore();
 ctx.imageSmoothingEnabled=oldSmooth;
}
function drawHUD(){ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillStyle="#fff";ctx.font="bold 27px Arial";ctx.fillText(score,W/2,42);ctx.font="bold 12px Arial";ctx.fillText("DIST "+Math.floor(distance)+"   •   BEST "+high+"   •   LV "+level+"   •   XP "+runXP+"/"+(12+upgradeTier*5),W/2,62);
 const boss=enemies.find(e=>e.type==="boss"||e.type==="dreadnought");if(boss){const bw=Math.min(260,W*.62),bx=(W-bw)/2,by=76;ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(bx-2,by-2,bw+4,12);ctx.fillStyle="#fff";ctx.fillRect(bx,by,bw,8);ctx.fillStyle=boss.type==="dreadnought"?"#9c78ff":"#ff405c";ctx.fillRect(bx,by,bw*(boss.health/boss.maxHealth),8);ctx.fillStyle="#fff";ctx.font="bold 10px Arial";ctx.fillText(boss.type==="dreadnought"?"DREADNOUGHT":"MOTHERSHIP",W/2,by+23)}let hudY=79;if(spreadTimer>0){ctx.fillStyle="#67f7ff";ctx.font="bold 11px Arial";ctx.fillText("SPREAD "+Math.ceil(spreadTimer/60)+"s",W/2,hudY);hudY+=15}if(shieldHits>0){ctx.fillStyle="#7dff9d";ctx.font="bold 11px Arial";ctx.fillText("SHIELD "+shieldHits,W/2,hudY)}if(powerMessage>0){ctx.globalAlpha=Math.min(1,powerMessage/20);ctx.fillStyle="#fff";ctx.font="bold 20px Arial";ctx.fillText(powerMessageText,W/2,H*.18);ctx.globalAlpha=1}}
function drawUpgrade(){
 ctx.fillStyle="rgba(2,5,15,.94)";ctx.fillRect(18,H*.20,W-36,H*.60);ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="bold 25px Arial";ctx.fillText("CHOOSE UPGRADE",W/2,H*.28);
 const labels=["RAPID FIRE","LASER POWER","PIERCING"],subs=["Shoot faster • LV "+rapidLevel+"/4","Break tough targets • LV "+powerLevel+"/3","Shots pass through targets • LV "+pierceLevel+"/2"];
 for(let i=0;i<3;i++){const y=H*.34+i*H*.13;ctx.fillStyle=i===0?"#163d55":i===1?"#512038":"#293b24";ctx.fillRect(38,y,W-76,H*.095);ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.strokeRect(38,y,W-76,H*.095);ctx.fillStyle="#fff";ctx.font="bold 17px Arial";ctx.fillText(labels[i],W/2,y+H*.038);ctx.font="12px Arial";ctx.fillText(subs[i],W/2,y+H*.067)}
}
function chooseUpgrade(y){
 for(let i=0;i<3;i++){const top=H*.34+i*H*.13;if(y>=top&&y<=top+H*.095){if(i===0)rapidLevel=Math.min(4,rapidLevel+1);else if(i===1)powerLevel=Math.min(3,powerLevel+1);else pierceLevel=Math.min(2,pierceLevel+1);powerMessageText=(rapidLevel>=3&&powerLevel>=2)?"WEAPON EVOLVED!":"UPGRADED: "+upgradeChoices[i];powerMessage=120;upgradeChoices=[];state="play";return true}}return false
}
function permCost(type){const n=type==="shield"?permShield:type==="rapid"?permRapid:permPower;return 15+n*20}
function buyPermanent(type){
 const n=type==="shield"?permShield:type==="rapid"?permRapid:permPower;if(n>=2)return false;const cost=permCost(type);if(credits<cost)return false;credits-=cost;
 if(type==="shield"){permShield++;localStorage.permShield=permShield}else if(type==="rapid"){permRapid++;localStorage.permRapid=permRapid}else{permPower++;localStorage.permPower=permPower}
 localStorage.dinoCredits=credits;return true
}
function drawHangar(){
 ctx.fillStyle="rgba(2,5,15,.95)";ctx.fillRect(18,H*.16,W-36,H*.70);ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="bold 25px Arial";ctx.fillText("TEX'S HANGAR",W/2,H*.23);ctx.fillStyle="#ffd45b";ctx.font="bold 14px Arial";ctx.fillText("CREDITS "+credits,W/2,H*.27);
 const names=["START SHIELD","START RAPID","START POWER"],levels=[permShield,permRapid,permPower],types=["shield","rapid","power"];
 for(let i=0;i<3;i++){const y=H*.33+i*H*.13,done=levels[i]>=2;ctx.fillStyle="#14243d";ctx.fillRect(38,y,W-76,H*.095);ctx.strokeStyle="#70cfff";ctx.strokeRect(38,y,W-76,H*.095);ctx.fillStyle="#fff";ctx.font="bold 16px Arial";ctx.fillText(names[i]+"  LV "+levels[i]+"/2",W/2,y+H*.037);ctx.font="12px Arial";ctx.fillStyle=done?"#7dff9d":"#ffd45b";ctx.fillText(done?"MAX":"BUY "+permCost(types[i])+" CREDITS",W/2,y+H*.066)}
 ctx.fillStyle="#fff";ctx.font="bold 17px Arial";ctx.fillText("TAP BOTTOM TO RETURN",W/2,H*.79)
}
function chooseHangar(y){const types=["shield","rapid","power"];for(let i=0;i<3;i++){const top=H*.33+i*H*.13;if(y>=top&&y<=top+H*.095){buyPermanent(types[i]);return true}}if(y>H*.73){state="start";return true}return false}
function drawStart(){
 ctx.fillStyle="rgba(2,5,15,.78)";ctx.fillRect(22,H*.25,W-44,285);ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="bold 32px Arial";ctx.fillText("DINO INVADERS",W/2,H*.34);
 ctx.fillStyle="#ff3535";ctx.font="bold 27px Arial";ctx.fillText("SPACE",W/2,H*.395);
 if(raptorReady){ctx.fillStyle="#fff";ctx.font="16px Arial";ctx.fillText("DRAG TO FLY",W/2,H*.47);ctx.fillText("DESTROY ASTEROIDS + INVADERS",W/2,H*.51);ctx.fillStyle="#ffd45b";ctx.font="bold 14px Arial";ctx.fillText("CREDITS "+credits+"   •   BEST LV "+bestLevel,W/2,H*.56);ctx.fillStyle="#fff";ctx.font="bold 20px Arial";ctx.fillText("TAP TO LAUNCH",W/2,H*.62);ctx.fillStyle="#123a59";ctx.fillRect(W/2-70,H*.655,140,42);ctx.strokeStyle="#70cfff";ctx.strokeRect(W/2-70,H*.655,140,42);ctx.fillStyle="#bcecff";ctx.font="bold 14px Arial";ctx.fillText("HANGAR",W/2,H*.685)}
 else if(raptorFailed){ctx.fillStyle="#ff5555";ctx.font="bold 17px Arial";ctx.fillText("RAPTOR IMAGE FAILED TO LOAD",W/2,H*.50)}
 else{ctx.fillStyle="#fff";ctx.font="bold 17px Arial";ctx.fillText("LOADING RAPTOR...",W/2,H*.51)}
}
function drawDead(){
 ctx.fillStyle="rgba(2,5,15,.88)";ctx.fillRect(25,H*.27,W-50,310);ctx.textAlign="center";ctx.fillStyle="#ff3535";ctx.font="bold 29px Arial";ctx.fillText("RAPTOR DOWN",W/2,H*.35);
 ctx.fillStyle="#fff";ctx.font="20px Arial";ctx.fillText("SCORE "+score,W/2,H*.405);ctx.font="15px Arial";ctx.fillText("Distance "+Math.floor(distance)+"   •   Level "+level,W/2,H*.45);ctx.fillText("Bosses "+bossesDefeated+"   •   Upgrades "+upgradeTier,W/2,H*.49);
 ctx.fillStyle="#ffd45b";ctx.font="bold 17px Arial";ctx.fillText("+"+lastCredits+" CREDITS",W/2,H*.545);ctx.font="13px Arial";ctx.fillText("BANK "+credits+"   •   BEST LV "+bestLevel+"   •   RUNS "+runs,W/2,H*.585);
 ctx.fillStyle="#fff";ctx.font="bold 19px Arial";ctx.fillText("TAP TO RELAUNCH",W/2,H*.65);
}
function draw(){
 ctx.save();if(screenShake>0)ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);
 drawSpace();drawPlanets();for(const a of asteroids)drawAsteroid(a);for(const e of enemies)drawEnemy(e);drawPowerups();drawBullets();drawShockwaves();drawParticles();drawPlayer();ctx.restore();
 drawHUD();if(state==="start")drawStart();if(state==="hangar")drawHangar();if(state==="upgrade")drawUpgrade();if(state==="dead")drawDead();
}
let last=performance.now(),accumulator=0;const STEP=1000/60;
function loop(now){let delta=now-last;last=now;if(delta>66)delta=66;accumulator+=delta;let steps=0;while(accumulator>=STEP&&steps<3){update();accumulator-=STEP;steps++}if(steps===3&&accumulator>=STEP)accumulator=0;draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function touchPosition(touch){const rect=canvas.getBoundingClientRect();return{x:touch.clientX-rect.left,y:touch.clientY-rect.top}}
canvas.addEventListener("touchstart",function(e){
 e.preventDefault();if(state==="start"){for(const touch of e.changedTouches){const p=touchPosition(touch);if(p.x>W/2-80&&p.x<W/2+80&&p.y>H*.64&&p.y<H*.72){state="hangar";return}}startGame();return}if(state==="dead"){startGame();return}if(state==="hangar"){for(const touch of e.changedTouches){const p=touchPosition(touch);if(chooseHangar(p.y))break}return}if(state==="upgrade"){for(const touch of e.changedTouches){const p=touchPosition(touch);if(chooseUpgrade(p.y))break}return}
 for(const touch of e.changedTouches){const p=touchPosition(touch);
  if(moveTouchID===null){
   moveTouchID=touch.identifier;lastMoveX=p.x;lastMoveY=p.y;firing=true;
   if(player.fireCooldown<=0)shoot();
  }
 }
},{passive:false});
canvas.addEventListener("touchmove",function(e){
 e.preventDefault();if(state!=="play")return;
 for(const touch of e.touches){if(touch.identifier!==moveTouchID)continue;const p=touchPosition(touch),dx=p.x-lastMoveX,dy=p.y-lastMoveY;
  player.x+=dx;player.y+=dy;player.x=Math.max(50,Math.min(W-65,player.x));player.y=Math.max(50,Math.min(H-65,player.y));lastMoveX=p.x;lastMoveY=p.y;
 }
},{passive:false});
function releaseTouches(e){e.preventDefault();for(const touch of e.changedTouches){if(touch.identifier===moveTouchID){moveTouchID=null;firing=false}}}
canvas.addEventListener("touchend",releaseTouches,{passive:false});
canvas.addEventListener("touchcancel",releaseTouches,{passive:false});
resize();
</script>
