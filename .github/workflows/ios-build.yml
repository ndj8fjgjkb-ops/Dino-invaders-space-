name: iPhone build check

on:
  push:
    branches: [main]
    paths:
      - index.html
      - nova-pilot.webp
      - assets/**
      - ios/**
      - scripts/build-web.mjs
      - package.json
      - package-lock.json
      - capacitor.config.json
      - .github/workflows/ios-build.yml
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Build for iPhone simulator without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
